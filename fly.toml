app = 'replace-with-your-app-name'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '4180'
  DB_PATH = '/app/data/paper.sqlite'
  BOT_HANDLE = 'StrikeAGentt'
  X_REPLY_MODE = 'draft'
  X_AUTOMATION_APPROVED = 'false'

[[mounts]]
  source = 'paper_data'
  destination = '/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 4180
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
